[package]
name = "stela"
version = "0.2.0"
edition = "2021"
description = "Конфигуратор памятников: импорт 3D-частей, размеры, текст и фото на стеле"
license = "MIT"
authors = ["Stela"]

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["persistence"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.29", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rfd = "0.15"
dirs = "5"
tobj = { version = "4", default-features = false }
gltf = { version = "1.4", features = ["utils", "import"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ttf-parser = "0.25"
ab_glyph = "0.2"
earcutr = "0.5"
geo = "0.28"

[profile.release]
lto = true
codegen-units = 1
